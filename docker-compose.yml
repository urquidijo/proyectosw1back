services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syndata
      POSTGRES_PASSWORD: syndata
      POSTGRES_DB: syndata
    ports:
      - "5433:5432"
    volumes:
      - syndata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndata -d syndata"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Reutiliza tus secretos reales (Stripe, IA, S3, JWT) ya existentes en
      # este archivo. La única variable que pisamos abajo es DATABASE_URL,
      # para que apunte al Postgres de este docker-compose en vez del de Neon.
      - ./.env
    environment:
      DATABASE_URL: postgresql://syndata:syndata@postgres:5432/syndata?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - syndata_uploads:/app/uploads

  frontend:
    build:
      context: ../proyectosw1front
      args:
        # Build-arg porque Next.js incrusta las vars NEXT_PUBLIC_* en el
        # bundle del navegador durante `npm run build`, no al arrancar.
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  syndata_postgres_data:
  syndata_uploads:
